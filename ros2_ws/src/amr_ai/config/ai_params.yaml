ai_mode_manager:
  ros__parameters:
    use_sim_time: false

    frame_id: "map"

    # Không dừng xe khi nhận bất kỳ alert nào.
    # nav_ppe_monitor_node chỉ gửi cảnh báo PPE về màn hình, không dừng.
    alert_stop_types: ["NONE"]

    A.x: 1.5
    A.y: 0.0
    A.yaw: 0.0

    B.x: 1.5
    B.y: 1.0
    B.yaw: 3.14

    H.x: 0.0
    H.y: 0.0
    H.yaw: 0.0


amr_ai:
  ros__parameters:
    use_sim_time: false

    # Camera topics
    color_topic: "/camera/color/image_raw"
    depth_topic: "/camera/depth/image_raw"
    camera_info_topic: "/camera/color/camera_info"
    depth_camera_info_topic: "/camera/depth/camera_info"

    # TF frames
    camera_frame: "camera_color_optical_frame"
    depth_frame: "camera_depth_optical_frame"
    base_frame: "base_footprint"
    odom_frame: "odom"
    map_frame: "map"

    # Model paths
    person_model_path: "models/yolo26n.engine"
    pose_model_path: "models/yolo26n-pose.engine"
    fire_smoke_model_path: "models/fire_smoke_s.engine"

    # Person following
    follow_distance_m: 2.0
    follow_distance_tolerance_m: 0.3
    detect_lock_time_s: 4.0
    target_lost_timeout_s: 3.0
    goal_update_period_s: 0.5
    min_goal_update_distance_m: 0.3

    # Safety
    enable_fall_alert: false
    enable_fire_smoke_alert: false
    alert_confidence_threshold: 0.5

    # Zone names
    home_zone_name: "HOME"
    zone_a_name: "A"
    zone_b_name: "B"

ai_image_probe:
  ros__parameters:
    color_topic: "/camera/color/image_raw"
    depth_topic: "/camera/depth/image_raw"
    camera_info_topic: "/camera/color/camera_info"
    print_period_sec: 1.0

person_tracker_node:
  ros__parameters:
    color_topic: "/camera/color/image_raw"
    depth_topic: "/camera/depth/image_raw"
    camera_info_topic: "/camera/color/camera_info"
    
    person_model_path: "models/yolo26n.engine"
    camera_frame: "camera_color_optical_frame"

    detect_conf: 0.4
    detect_lock_time_s: 4.0
    enroll_frames: 90
    target_lost_timeout_s: 3.0

    process_every_n_frames: 2

    enable_ppe_check: true
    ppe_model_path: "models/ppe_s.engine"
    ppe_imgsz: 640
    ppe_conf: 0.15
    ppe_iou: 0.50
    ppe_helmet_ok_conf: 0.15
    ppe_vest_ok_conf: 0.35
    ppe_run_interval: 10
    ppe_confirm_frames: 5
    ppe_clear_frames: 1

    follow_detecting_timeout_s: 30.0

    alert_topic: "/amr_ai/alert"

    enable_debug_image: true
    debug_image_topic: "/amr_ai/debug/person_tracker/image"
    debug_image_publish_hz: 3.0
    debug_image_scale: 0.5

follow_servo_node:
  ros__parameters:
    follow_distance_m: 2.0
    distance_tolerance_m: 0.18

    k_linear: 0.30
    k_angular: 0.50

    max_linear_x: 0.22
    min_linear_x: 0.04
    max_angular_z: 0.20

    angle_deadband_rad: 0.2

    slow_angle_rad: 0.75
    min_angle_speed_scale: 0.45
    hard_rotate_angle_rad: 1.10

    # Cho phép vẫn tiến nhẹ khi vừa cua vừa bám
    enable_turn_forward_bias: true
    turn_forward_min_x: 0.055
    turn_forward_angle_min_rad: 0.07
    turn_forward_angle_max_rad: 0.75
    turn_forward_distance_margin_m: 0.10

    # Giới hạn gia tốc để mượt kiểu Nav2
    max_linear_accel: 0.18
    max_linear_decel: 0.28
    max_angular_accel: 0.55
    max_angular_decel: 0.75

    angular_sign: -1.0

    target_timeout_s: 0.7
    command_rate_hz: 20.0
    cmd_vel_follow_topic: "/cmd_vel_follow"

    enable_smoothing: true
    smoothing_alpha: 0.25


cmd_vel_safety_mux_node:
  ros__parameters:
    nav_cmd_topic: "/cmd_vel"
    follow_cmd_topic: "/cmd_vel_follow"
    localize_cmd_topic: "/cmd_vel_localize"
    output_cmd_topic: "/cmd_vel_safe"

    mode_topic: "/amr_ai/mode"
    target_topic: "/amr_ai/person_target"
    scan_topic: "/scan_filtered"

    mux_rate_hz: 20.0

    target_timeout_s: 0.7
    command_timeout_s: 0.5
    scan_timeout_s: 0.5
    require_scan_for_motion: true

    # Nếu LiDAR front sector không đúng, sẽ chỉnh thông số này sau khi test.
    front_center_angle_rad: 0.0
    front_angle_deg: 35.0

    emergency_stop_distance_m: 0.45
    slowdown_distance_m: 0.80

ai_detector_node:
  ros__parameters:
    color_topic: "/camera/color/image_raw"
    depth_topic: "/camera/depth/image_raw"

    person_model_path: "models/yolo26n.engine"
    pose_model_path: "models/yolo26n-pose.engine"
    fire_smoke_model_path: "models/fire_smoke_s.engine"

    detect_conf: 0.4
    process_every_n_frames: 2

    enable_fall_alert: false
    enable_fire_smoke_alert: false

    mode_topic: "/amr_ai/mode"
    suppress_fire_smoke_in_follow: true
    suppress_fall_in_follow: true
    # Trong NAV2: tắt FALL/FIRE/SMOKE — nav_ppe_monitor_node đảm nhận PPE thay thế
    suppress_fall_in_nav: true
    suppress_fire_smoke_in_nav: true

    fire_smoke_run_interval: 5
    fire_alert_hold_sec: 2.0
    smoke_alert_hold_sec: 2.0

    fire_conf: 0.87
    smoke_conf: 0.92
    fire_smoke_imgsz: 640

    alert_topic: "/amr_ai/alert"
    publish_normal_status: true
    normal_status_period_s: 1.0

    publish_debug_image: true
    debug_image_topic: "/amr_ai/debug/alert/image"
    debug_image_publish_hz: 3.0
    debug_image_scale: 0.5

auto_initial_pose_node:
  ros__parameters:
    enabled: true

    initial_pose_topic: "/initialpose"
    frame_id: "map"

    # HOME pose mặc định
    initial_x: 0.0
    initial_y: 0.0
    initial_yaw: 0.0

    # Covariance nhỏ vì giả định xe thật sự đang ở HOME khi START
    covariance_x: 0.05
    covariance_y: 0.05
    covariance_yaw: 0.05

    # Đợi Nav2/AMCL lên rồi mới publish
    start_delay_s: 2.0
    publish_count: 10
    publish_period_s: 0.3

auto_localizer_node:
  ros__parameters:
    global_localization_service: "/reinitialize_global_localization"
    amcl_pose_topic: "/amcl_pose"
    cmd_vel_localize_topic: "/cmd_vel_localize"
    set_mode_service: "/amr_ai/set_mode"

    spin_angular_z: 0.25
    min_spin_time_s: 8.0
    max_spin_time_s: 45.0
    control_rate_hz: 10.0

    cov_x_threshold: 0.25
    cov_y_threshold: 0.25
    cov_yaw_threshold: 0.35
    stable_required_count: 10

    stop_publish_count: 10

esp32_alert_bridge_node:
  ros__parameters:
    esp32_ip: "192.168.1.36"

nav_ppe_monitor_node:
  ros__parameters:
    color_topic: "/camera/color/image_raw"
    mode_topic:  "/amr_ai/mode"
    alert_topic: "/amr_ai/alert"

    # [LEGACY — không còn dùng để load model, giữ tương thích]
    person_model_path: "models/yolo26n.engine"
    ppe_model_path:    "models/ppe_s.engine"

    # Pose model — THAY THẾ person_model, dùng keypoint COCO 17 điểm
    # để lọc tay/chân lẻ và xác định đầu có nhìn rõ hay không (thay vì
    # đoán qua geometry/PPE-model-confidence như trước)
    pose_model_path: "models/yolo26n-pose.engine"

    # Ngưỡng confidence để coi 1 keypoint là "nhìn thấy được"
    kpt_conf_threshold: 0.30

    # Số keypoint thân (mũi+2 vai+2 hông) tối thiểu để chấp nhận là
    # người thật (loại tay/chân lẻ lọt vào khung)
    min_valid_body_kpts: 2

    # Box conf cao → tin trực tiếp, không cần thêm điều kiện keypoint
    # (bù trừ góc nghiêng/che khuất khiến mọi keypoint đều mờ)
    high_conf_box_threshold: 0.60

    # Ngưỡng conf keypoint vùng đầu (mũi/2 mắt/2 tai) để coi "đầu nhìn rõ"
    head_kpt_conf_threshold: 0.30

    # Overlap tối thiểu (item ∩ person / item) để match PPE — dùng
    # overlap thay tâm-điểm, không bỏ sót vest khi nghiêng/cầm vật
    ppe_match_min_overlap: 0.30

    # Góc nghiêng thân tối thiểu (độ) để báo thiếu áo — 90=thẳng đứng.
    # Nghiêng/cúi dưới ngưỡng → vùng áo co ngắn, model khó detect → bỏ qua
    min_torso_angle_for_vest_check: 90.0

    # Box aspect (h/w) tối thiểu coi người đứng thẳng (nguồn tín hiệu
    # thẳng đứng độc lập với hông keypoint — cho case đứng thẳng hông mờ)
    upright_box_aspect_min: 1.80

    # Mũi cao hơn vai tối thiểu (tỉ lệ khoảng vai) để coi đầu ngẩng
    # (không cúi gục) — loại trường hợp ngồi xổm gục đầu vẫn báo thiếu nón
    head_above_shoulder_ratio: 0.15

    # Tỉ lệ dọc/ngang tối thiểu (vai-hông) coi thân ĐỨNG THẲNG — robust
    # với đứng nghiêng/xoay lưng/side-view (thay torso_angle atan2 vốn bị
    # lệch khi xoay hướng). Giảm → chấp nhận nghiêng nhiều hơn.
    torso_vertical_ratio_min: 1.0

    # Bề rộng cho phép (tỉ lệ khoảng vai) coi cổ tay/khuỷu tay "gần trục
    # giữa thân" khi phát hiện tay ôm/bê vật che thân. Lớn hơn → nhạy hơn.
    hands_cover_x_ratio: 0.60

    # Bật log chẩn đoán chi tiết để tinh chỉnh ngưỡng theo dữ liệu thật
    diag_logging: false

    # Ngưỡng MẠNH cho keypoint đầu — chỉ đầu thật rõ mới xét mũ
    # (tránh báo thiếu nón oan khi cúi còn ló 1 tai/mắt)
    head_kpt_strong_conf: 0.50
    min_head_kpts_visible: 2

    # Ngưỡng cao cho hông — pose hay nội suy hông conf cao dù bị che
    # (ôm thùng trước bụng). Ngưỡng cao phân biệt hông thật thấy vs đoán
    hip_kpt_conf_threshold: 0.95

    # Số keypoint vai/hông tối thiểu để phân loại FULL_BODY (thay vì
    # HEAD_ONLY)
    # [LEGACY — không còn dùng, giữ tương thích]
    min_torso_kpts_for_full_body: 2

    # Số keypoint HÔNG tối thiểu để coi là FULL_BODY (đáng tin cậy hơn
    # vai — vai lộ không đủ chứng minh vùng áo cũng lộ theo)
    min_hip_kpts_for_full_body: 1

    # Cổ tay (proxy bàn tay) — điều kiện xét THIẾU GĂNG TAY
    wrist_kpt_conf_threshold: 0.50
    min_wrist_kpts_visible: 1

    # Làm mượt (EMA) confidence keypoint đầu — giảm chập chờn lúc cúi đầu
    head_conf_smoothing_alpha: 0.4

    detect_conf:  0.4
    max_persons:  3          # tối đa 3 công nhân cùng lúc

    # PPE inference chạy mỗi N frame nhận được
    ppe_run_interval: 10

    # PPE model params
    ppe_imgsz:          640
    ppe_conf:           0.15
    ppe_iou:            0.50
    ppe_helmet_ok_conf: 0.15
    ppe_vest_ok_conf:   0.35
    ppe_gloves_ok_conf: 0.30

    # Bật/tắt detect từng loại PPE độc lập (tiện test).
    # Tắt loại nào → không bao giờ báo thiếu loại đó.
    enable_helmet_check: true
    enable_vest_check:   true
    enable_gloves_check: false

    # Hysteresis: tránh báo nhầm khi người quay lưng thoáng qua
    confirm_frames: 7    # cần 3 lần vi phạm liên tiếp mới bật alarm
    clear_frames:   3    # cần 5 lần OK liên tiếp mới tắt alarm

    # ----------------------------------------------------------
    # Geometry filter — lọc box bộ phận cơ thể (tay/chân/thân không đầu)
    # ----------------------------------------------------------
    min_person_height_ratio: 0.03   # noise floor — chỉ loại detection siêu nhỏ/nhiễu
    min_person_aspect_ratio: 0.70   # h/w thấp hơn 0.70 → loại (box nằm ngang rõ ràng)

    # Đầu sát/ngoài mép trên frame → không thể check mũ
    head_clip_margin_ratio: 0.05

    # Chỉ suppress "uncertain" (cả 2 score=0) khi box NHỎ hơn ngưỡng này
    # (full body). Box LỚN mà vẫn uncertain → giữ missing=True (vi phạm thật).
    uncertain_suppress_max_height_ratio: 0.35

    # ----------------------------------------------------------
    # Head-only classification — thân bị che, chỉ lộ đầu (ngồi sau bàn/vật cản)
    # ----------------------------------------------------------
    # h/w >= ngưỡng này → FULL BODY (check cả mũ + áo)
    # h/w <  ngưỡng này → HEAD_ONLY (chỉ check mũ trên toàn bộ box)
    # [LEGACY — không còn dùng để phân loại chính, xem head_occupancy_ratio_threshold]
    full_body_aspect_min: 1.30

    # Phân loại chính: tỉ lệ (chiều cao helmet/no_helmet detect được) /
    # (chiều cao person box). >= ngưỡng này → HEAD_ONLY (đầu chiếm phần
    # lớn box, thân bị che). Nhỏ hơn → FULL_BODY. Không tìm thấy mũ/đầu
    # nào trong box → UNCERTAIN (bỏ qua, không báo gì).
    head_occupancy_ratio_threshold: 0.30

    # Ngưỡng suppress uncertain riêng cho box HEAD_ONLY (nhỏ hơn ngưỡng
    # full-body vì box đầu vốn nhỏ hơn box toàn thân một cách tự nhiên)
    uncertain_suppress_max_height_ratio_head_only: 0.12

    publish_debug_image:    true
    debug_image_topic:      "/amr_ai/debug/nav_ppe/image"
    debug_image_publish_hz: 3.0
    debug_image_scale:      0.5